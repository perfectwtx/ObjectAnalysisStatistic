name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ObjectAnalyzer.sln

      - name: Build
        run: dotnet build ObjectAnalyzer.sln --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test ObjectAnalyzer.sln
          --no-build
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults

      - name: Publish CLI
        run: >
          dotnet publish
          src/ObjectAnalyzer/ObjectAnalyzer.csproj
          -c Release
          -o artifacts/cli
          --no-restore

      - name: Pack CLI as dotnet tool
        run: >
          dotnet pack
          src/ObjectAnalyzer/ObjectAnalyzer.csproj
          -c Release
          -o artifacts/packages
          --no-restore

      - name: Publish Web
        run: >
          dotnet publish
          src/ObjectAnalyzer.Web/ObjectAnalyzer.Web.csproj
          -c Release
          -o artifacts/web
          --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: artifacts
