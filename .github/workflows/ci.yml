name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Home.razor
        if: hashFiles('.github/repair-trigger.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          git checkout a06c3162703f781202461065cc7ab4f08ee5f021 -- src/ObjectAnalyzer.Web/Components/Pages/Home.razor
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ObjectAnalyzer.Web/Components/Pages/Home.razor')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('@inject LocalizationService Loc\n@implements IDisposable', '@inject LocalizationService Loc\n@inject WebAnalysisExecutionService AnalysisExecutionService\n@implements IDisposable', 1)
          old = '''var pipelineResult = await Task.Run(\n                () => Core.Analysis.Pipeline.AnalysisPipeline.Execute(analysisOptions, rules, runContext, token),\n                token);'''
          new = '''var pipelineResult = await AnalysisExecutionService.ExecuteAsync(\n                State.FileName,\n                effectiveFormat,\n                analysisOptions,\n                rules,\n                runContext,\n                token);'''
          if old not in s:
              raise SystemExit('target analysis call not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig', newline='')
          PY
          rm -f .github/repair-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ObjectAnalyzer.Web/Components/Pages/Home.razor .github/repair-trigger.txt
          git diff --cached --check
          git commit -m "fix(web): persist analysis jobs from home page"
          git push origin HEAD:main

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ObjectAnalyzer.sln

      - name: Build
        run: dotnet build ObjectAnalyzer.sln --no-restore -c Release

      - name: Test
        run: dotnet test ObjectAnalyzer.sln --no-build -c Release

      - name: Publish CLI
        run: >
          dotnet publish
          src/ObjectAnalyzer/ObjectAnalyzer.csproj
          -c Release
          -o artifacts/cli
          --no-restore

      - name: Pack CLI as dotnet tool
        run: >
          dotnet pack
          src/ObjectAnalyzer/ObjectAnalyzer.csproj
          -c Release
          -o artifacts/packages
          --no-restore

      - name: Publish Web
        run: >
          dotnet publish
          src/ObjectAnalyzer.Web/ObjectAnalyzer.Web.csproj
          -c Release
          -o artifacts/web
          --no-restore
